<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Car body -->
  <path d="M 12 35 L 15 25 L 20 20 L 44 20 L 49 25 L 52 35 L 52 42 L 50 45 L 14 45 L 12 42 Z" 
        fill="url(#carGradient)" stroke="#6B21A8" stroke-width="1.5"/>
  
  <!-- Car windows -->
  <path d="M 21 25 L 23 22 L 30 22 L 31 25 Z" fill="#1E1B4B" opacity="0.7"/>
  <path d="M 33 25 L 34 22 L 41 22 L 43 25 Z" fill="#1E1B4B" opacity="0.7"/>
  
  <!-- Front wheel -->
  <circle cx="20" cy="45" r="6" fill="#2D3748" stroke="#1A202C" stroke-width="1.5"/>
  <circle cx="20" cy="45" r="3" fill="#4A5568"/>
  
  <!-- Back wheel -->
  <circle cx="44" cy="45" r="6" fill="#2D3748" stroke="#1A202C" stroke-width="1.5"/>
  <circle cx="44" cy="45" r="3" fill="#4A5568"/>
  
  <!-- Headlight -->
  <circle cx="51" cy="35" r="2" fill="#FEF3C7" opacity="0.9"/>
  
  <!-- Door line -->
  <line x1="32" y1="25" x2="32" y2="42" stroke="#6B21A8" stroke-width="1" opacity="0.5"/>
</svg>
